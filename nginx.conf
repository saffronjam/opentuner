worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /dev/stdout;
 sendfile on;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy 'microphone=(self), camera=()' always;
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
  location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
  location / { add_header Cache-Control 'no-cache'; try_files $uri $uri/ /index.html; }
 }
}
